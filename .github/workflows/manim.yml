name: Render Manim video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prediabetes_explainer.py"
      - ".github/workflows/manim.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev
      - run: pip install manim
      - run: manim -qh prediabetes_explainer.py PrediabetesExplainer
      - uses: actions/upload-artifact@v4
        with:
          name: prediabetes-manim-video
          path: media/videos/prediabetes_explainer/1080p60/PrediabetesExplainer.mp4
