name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion render index.ts Prediabetes out/prediabetes.mp4 --crf=16
      - uses: actions/upload-artifact@v4
        with:
          name: prediabetes-video
          path: out/prediabetes.mp4
